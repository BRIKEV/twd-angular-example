name: Record a PR's tests

# Label a PR `record` and this records the tests the branch added, then comments
# the link. Separate from the test workflow: a recording is optional, the pull
# request it describes is not.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: record-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record:
    # The label is the permission gate; fork PRs never reach this job.
    if: >-
      github.event.label.name == 'record' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A recording must never cost more than a recording.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # comment the link, drop the label
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # The PR head, not the merge commit; fetch-depth 0 so --changed-since
      # can see the base commit.
      - name: Checkout the PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start mock API
        run: |
          nohup npm run serve > json-server.log 2>&1 &
          npx wait-on http://localhost:3001/api/todos

      - name: Start Angular dev server
        run: |
          nohup npm run start > ng.log 2>&1 &
          npx wait-on http://localhost:4200
        env:
          CI: true

      - name: Record the tests this branch added
        id: rec
        uses: BRIKEV/twd-cli/.github/actions/record@88f0ea912ae9b7c3bbc374e95fe876a58b4114b7 # v1.10.0
        with:
          changed-since: ${{ github.event.pull_request.base.sha }}
          artifact-name: twd-recording-pr-${{ github.event.pull_request.number }}

      # Best-effort. Zero clips is normal: a branch that changed no tests has
      # nothing to record.
      - name: Comment the link
        if: always()
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLIPS: ${{ steps.rec.outputs.clip-count }}
          VIDEO_URL: ${{ steps.rec.outputs.artifact-url }}
        run: |
          if [ "${CLIPS:-0}" = "0" ]; then
            gh pr comment "$PR_NUMBER" --body "Nothing to record: this branch added no TWD tests."
          else
            gh pr comment "$PR_NUMBER" --body "Recording: ${CLIPS} clip(s), one per test this branch added — [download the artifact](${VIDEO_URL}) and unzip."
          fi

      # Dropping the label makes a retry one click.
      - name: Drop the label
        if: always()
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label record
